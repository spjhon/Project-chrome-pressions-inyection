
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inyector de Presiones CDA</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="popup-container">
        <header class="popup-header">
            <div class="header-icon" aria-hidden="true">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="26"
                    height="26"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 7v5l3 2"></path>
                    <path d="M5.6 5.6 4 4"></path>
                    <path d="m18.4 5.6 1.6-1.6"></path>
                </svg>
            </div>

            <div class="header-text">
                <h1>Inyector de Presiones</h1>
                <p>Automatización de Tecmmas</p>
            </div>
        </header>

        <div class="divider"></div>

        <!-- Mensajes de estado de la extensión -->
        <div
            id="estado"
            class="status-message"
            role="status"
            aria-live="polite"
        >
            Verificando conexión con Tecmmas...
        </div>

        <!-- Selector de placas encontradas en Tecmmas -->
        <form id="form-presiones" class="form-container">
            <label for="placa">Selecciona la placa</label>

            <select
                id="placa"
                name="placa"
                required
                disabled
            >
                <option value="">Esperando vehículos...</option>
            </select>

            <p class="input-help">
                Selecciona el vehículo al que deseas inyectar las presiones.
            </p>

            <button
                type="submit"
                id="btn-inyectar"
                disabled
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M12 3v12"></path>
                    <path d="m7 10 5 5 5-5"></path>
                    <path d="M5 17v4h14v-4"></path>
                </svg>

                <span>Inyectar Presiones</span>
            </button>
        </form>

        <footer class="popup-footer">
            <span class="status-indicator"></span>
            <span>Extensión CDA</span>
            <span class="footer-version">v1.0.0</span>
        </footer>
    </main>

    <script src="popup.js"></script>
</body>
</html>
